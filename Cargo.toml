[package]
name = "powerjack"
version = "0.1.0"
edition = "2021"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dioxus = { version = "0.7.9", features = ["router"] }
thiserror = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }

[dev-dependencies]
tempfile = "3"

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
