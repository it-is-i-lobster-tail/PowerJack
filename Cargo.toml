[workspace]
members = [
    "apps/mobile",
    "apps/self_hosted",
    "apps/web",
    "crates/core",
    "crates/storage",
    "crates/ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
dioxus = { version = "0.7.9", features = ["router"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"

powerjack-core = { path = "crates/core" }
powerjack-storage = { path = "crates/storage", default-features = false }
powerjack-ui = { path = "crates/ui", default-features = false }

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
