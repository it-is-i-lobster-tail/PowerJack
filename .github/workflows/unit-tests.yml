name: Unit tests

# Pull requests run against GitHub's synthetic merge ref.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XCODE_PATH: /Applications/Xcode_27.2.app
  SIMULATOR: iPhone 17e
  IOS_VERSION: "27.2"

jobs:
  test:
    name: Unit tests
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      unit-tests: ${{ steps.unit-tests.outcome }}

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select --switch "$XCODE_PATH"
          xcodebuild -version

      # Runners sometimes start with no simulators listed, so create our own.
      - name: Create simulator
        run: |
          runtime=$(xcrun simctl list runtimes --json | jq -r --arg device "$SIMULATOR" --arg version "$IOS_VERSION" '
            [.runtimes[]
              | select(.platform == "iOS" and .isAvailable and .version == $version)
              | select(any(.supportedDeviceTypes[]; .name == $device))]
            | sort_by(.version | split(".") | map(tonumber))
            | last | .identifier // empty')

          if [ -z "$runtime" ]; then
            echo "::error::No iOS $IOS_VERSION runtime on this runner supports $SIMULATOR."
            exit 1
          fi

          udid=$(xcrun simctl create "CI $SIMULATOR" "$SIMULATOR" "$runtime")
          echo "Created $SIMULATOR on $runtime ($udid)"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Run unit tests
        id: unit-tests
        env:
          TEST_RUNNER_POWERJACK_EXPORT_CLOUDKIT_MODEL: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project PowerJack/PowerJack.xcodeproj \
            -scheme PowerJack \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult

      - name: Prepare CloudKit Development schema
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          CLOUDKIT_MANAGEMENT_TOKEN: ${{ secrets.CLOUDKIT_API_TOKEN }}
        run: |
          git fetch --depth=1 --no-tags origin main
          if ! git diff --quiet HEAD FETCH_HEAD -- PowerJack/PowerJack scripts/merge-cloudkit-schema.py PowerJack/PowerJackTests/CloudKitSchemaExportTests.swift; then
            echo "A newer app build is on main. This run skipped the CloudKit update." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ -z "$CLOUDKIT_MANAGEMENT_TOKEN" ]]; then
            echo "::error::Set CLOUDKIT_API_TOKEN to a CloudKit Management Token."
            exit 1
          fi

          umask 077
          scratch=$(mktemp -d "$RUNNER_TEMP/cloudkit.XXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          # Xcode may shut down the fresh simulator after the tests.
          data=$(xcrun simctl list devices --json | jq -er --arg udid "$SIMULATOR_UDID" '.devices[][] | select(.udid == $udid) | .dataPath')
          shopt -s nullglob
          models=("$data"/Containers/Data/Application/*/Library/Caches/PowerJackCloudKitModel.json)
          if [[ ${#models[@]} -ne 1 ]]; then
            echo "::error::Expected one compiled model in the simulator cache."
            exit 1
          fi
          model="${models[0]}"
          development="$scratch/development.ckdb"
          prepared="$scratch/prepared.ckdb"
          production="$scratch/production.ckdb"
          container=(--team-id KWZTWNA57G --container-id iCloud.com.stanleycloud.PowerJack)

          # Keep CloudKit's schema and diagnostics off the public workflow log.
          cktool() {
            local operation=$1
            shift
            if ! xcrun cktool "$@" > "$scratch/diagnostics" 2>&1; then
              echo "::error::Could not $operation. Check the Management Token and container access."
              return 1
            fi
          }

          compile_schema() {
            if ! python3 scripts/merge-cloudkit-schema.py "$model" "$development" "$prepared" > "$scratch/diagnostics" 2>&1; then
              echo "::error::Could not reconcile the compiled model with CloudKit Development. Review the schema in CloudKit Console."
              return 1
            fi
          }

          cktool "export the Development schema" export-schema "${container[@]}" --environment development --output-file "$development"
          compile_schema
          if ! cmp -s "$development" "$prepared"; then
            cktool "validate and import the Development schema" import-schema "${container[@]}" --environment development --validate --file "$prepared"
            rm "$development"
            cktool "verify the Development schema" export-schema "${container[@]}" --environment development --output-file "$development"
            compile_schema
            if ! cmp -s "$development" "$prepared"; then
              echo "::error::CloudKit Development is still missing fields from the compiled model."
              exit 1
            fi
            echo "Applied schema changes from the compiled model to CloudKit Development." >> "$GITHUB_STEP_SUMMARY"
          fi

          cktool "export the Production schema" export-schema "${container[@]}" --environment production --output-file "$production"
          if cmp -s "$development" "$production"; then
            echo "The CloudKit Development and Production exports match." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The CloudKit Development and Production exports differ. Before merging main into staging, review **Deploy Schema Changes** in [CloudKit Console](https://icloud.developer.apple.com/)." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Each merge to main raises the patch version (0.1.0 -> 0.1.1) and commits it
  # back, so Archive builds from main carry the next version. A push that
  # already changes MARKETING_VERSION keeps the version it set. Each commit on
  # main that sets a version is tagged v<version>.
  bump-version:
    name: Bump patch version
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' && needs.test.outputs.unit-tests == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump patch version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff "$BEFORE" HEAD -- PowerJack/PowerJack.xcodeproj/project.pbxproj | grep -q '^+.*MARKETING_VERSION'; then
            echo "This push sets the version itself, so it is left as is."
            exit 0
          fi

          # Another merge can land on main while the tests run. Bump on top of the latest
          # main, so the push isn't rejected; that merge's own run bumps again after it.
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            version=$(scripts/bump-patch-version.sh)
            git commit -am "Bump version to $version"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Main kept moving, so the version bump couldn't be pushed."
          exit 1

      # Includes versions set before tagging began, and any a failed run missed.
      - name: Tag versions
        run: |
          project=PowerJack/PowerJack.xcodeproj/project.pbxproj
          for commit in $(git log --first-parent --format=%H -G'MARKETING_VERSION' HEAD -- "$project"); do
            version=$(git show "$commit:$project" | sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' | sort -u)
            if ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              git tag "v$version" "$commit"
              echo "Tagged v$version"
            fi
          done
          git push origin --tags
