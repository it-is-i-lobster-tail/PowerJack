name: Flake check (temporary)

# Runs the tests that used to fail now and then many times in a row.
# Removed again before this branch merges.
on:
  pull_request:

jobs:
  repeat:
    if: github.head_ref == 'claude/reliable-ci-tests'
    name: Repeat flaky tests
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      XCODE_PATH: /Applications/Xcode_27.2.app
      SIMULATOR: iPhone 17e
      IOS_VERSION: "27.2"
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select --switch "$XCODE_PATH"
      - name: Create simulator
        run: |
          runtime=$(xcrun simctl list runtimes --json | jq -r --arg device "$SIMULATOR" --arg version "$IOS_VERSION" '
            [.runtimes[]
              | select(.platform == "iOS" and .isAvailable and .version == $version)
              | select(any(.supportedDeviceTypes[]; .name == $device))]
            | last | .identifier // empty')
          udid=$(xcrun simctl create "CI $SIMULATOR" "$SIMULATOR" "$runtime")
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: Run keyboard and typing tests 20 times
        run: |
          set -o pipefail
          xcodebuild test \
            -project PowerJack/PowerJack.xcodeproj \
            -scheme PowerJack \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -only-testing:PowerJackTests/KeyboardLayoutTests \
            -only-testing:'PowerJackTests/ChartSearchSampleHistoryTests/typingLatency()' \
            -test-iterations 20
