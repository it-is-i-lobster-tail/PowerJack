name: Publish Docker image

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check app
        run: npm run check

      - name: Build app
        run: npm run build

      - name: Resolve image settings
        id: image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_HUB_PERSON_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          : "${DOCKERHUB_USERNAME:?Set the DOCKERHUB_USERNAME repository variable.}"
          : "${DOCKERHUB_NAMESPACE:?Set the DOCKERHUB_NAMESPACE repository variable.}"
          : "${DOCKERHUB_IMAGE:?Set the DOCKERHUB_IMAGE repository variable.}"
          : "${DOCKERHUB_TOKEN:?Set the DOCKER_HUB_PERSON_ACCESS_TOKEN repository secret.}"

          image_name="${DOCKERHUB_NAMESPACE}/${DOCKERHUB_IMAGE}"
          if [[ "${image_name}" =~ [A-Z] ]]; then
            echo "::error::Docker image names must be lowercase. Update DOCKERHUB_NAMESPACE or DOCKERHUB_IMAGE."
            exit 1
          fi

          version_prefix="$(node -p "const version = require('./package.json').version.split('.'); if (version.length < 2) throw new Error('package.json version must include major and minor parts'); version.slice(0, 2).join('.')")"

          {
            echo "name=${image_name}"
            echo "version=${version_prefix}.${GITHUB_RUN_NUMBER}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PERSON_ACCESS_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.image.outputs.version }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=PowerJack
            org.opencontainers.image.description=Client-only PowerJack static web app

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
