<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1214" />
    <meta name="apple-mobile-web-app-title" content="PowerJack" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preload" as="image" href="/assets/power-jack-logo-favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #121411;
      }

      #root {
        min-height: 100vh;
        background: #121411;
      }

      @supports (min-height: 100dvh) {
        #root {
          min-height: 100dvh;
        }
      }

      #powerjack-launch {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #121411;
        opacity: 1;
        pointer-events: none;
        transition: opacity 180ms ease;
      }

      #powerjack-launch[data-state="hidden"] {
        opacity: 0;
      }

      .powerjack-launch__mark {
        width: 96px;
        height: 96px;
        overflow: hidden;
        background: #10140f;
        border: 1px solid rgba(241, 239, 233, 0.08);
        border-radius: 24px;
      }

      .powerjack-launch__mark img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      @media (prefers-reduced-motion: reduce) {
        #powerjack-launch {
          transition: none;
        }
      }
    </style>
    <title>PowerJack</title>
  </head>
  <body>
    <div
      id="powerjack-launch"
      aria-label="PowerJack is starting"
      data-agent-id="app-launch-splash"
      role="status"
    >
      <div class="powerjack-launch__mark" aria-hidden="true">
        <img alt="" src="/assets/power-jack-logo-favicon.png" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
